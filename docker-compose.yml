version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: movies_backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    networks:
      - app-network

  frontend:
    build: ./Frontend
    container_name: movies_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge